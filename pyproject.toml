[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telechatai"
version = "1.2.0"
description = "Claude AI on your phone/desktop — personal, self-hosted messenger bot for Telegram, WhatsApp, and Slack"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "telechatai" }]
keywords = ["telechat", "claude", "telegram", "whatsapp", "slack", "chatbot", "ai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "python-telegram-bot>=21.6",
    "anthropic>=0.99.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "slack-bolt>=1.21.0",
    "aiohttp>=3.9.0",
]

# Optional features. Install with e.g. `pip install telechatai[web,docs,all]`.
# These are imported with try/except inside the package so the bot still runs
# without them, but installing the extra makes the feature actually work.
[project.optional-dependencies]
qr = ["qrcode>=7.4"]
sdk = ["claude-code-sdk>=0.0.10"]
docs = [
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
]
browser = ["playwright>=1.40.0"]
httpx = ["httpx>=0.27.0"]
mcp = ["jsonschema>=4.21.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    # E2E cassette recording for the Anthropic / httpx round-trip tests.
    # See tests/README_E2E.md for record/replay workflow.
    "vcrpy>=6.0",
    "pytest-recording>=0.13",
    # Lint + format. Pinned to a minor range: ruff adds rules in minor
    # releases, and a rule added upstream should not turn CI red on a tree
    # nobody touched.
    "ruff>=0.14,<0.16",
]
all = [
    "qrcode>=7.4",
    "claude-code-sdk>=0.0.10",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
]

[project.urls]
Homepage = "https://github.com/telechatai/telechat"
Repository = "https://github.com/telechatai/telechat"
Issues = "https://github.com/telechatai/telechat/issues"

[project.scripts]
telechat = "telechat_pkg.main:cli_entry"

[tool.setuptools.packages.find]
include = ["telechat_pkg*"]

[tool.setuptools.package-data]
# Ship the web chat HTML template and any other in-package data files. The
# previous "scripts/*" glob matched nothing — no scripts/ subdir exists inside
# telechat_pkg — so it was removed.
telechat_pkg = ["*.html"]

# ─── Test runner ─────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers turns a typo'd @pytest.mark.asyncio into an error rather
# than a silently synchronous test. -ra surfaces skip/xfail reasons, which is
# how the platform-conditional tests report that they didn't actually run.
addopts = "--strict-markers -ra"
asyncio_mode = "strict"
markers = [
    "benchmark: performance benchmark (tests/bench_telechat.py; needs pytest-benchmark)",
]

# ─── Lint / format ───────────────────────────────────────────────────────────
# Multiple agents work this tree in parallel (see AGENTS.md), so style drift and
# dead code used to be caught only by review. `ruff check` runs in CI.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", "dist", "npm", ".benchmarks"]

[tool.ruff.lint]
# Deliberately narrow: correctness and dead code, not style opinions. Widening
# this is fine; it just wants to happen in a commit of its own so the signal
# isn't buried in a reformat.
select = ["E4", "E7", "E9", "F", "B", "W"]
ignore = [
    "E501",  # line length — a chunk of the tree predates any limit
    "E741",  # ambiguous names (`l`) — worth fixing, not worth a 31-site sweep here
    "B008",  # function call in default arg — used deliberately for defaults
]

[tool.ruff.lint.per-file-ignores]
# Tests set env vars before importing telechat_pkg (conftest.py explains why),
# so imports legitimately follow statements.
"tests/*" = [
    "E402",
    "F841",  # `with patch(...) as mock_x` where the mock is never asserted on
    "B017",  # assertRaises(Exception) — some tests genuinely mean "anything"
    "B007",  # `for i in range(n)` loops that only need the repetition
]
"telechat_pkg/telegram_bot.py" = ["E402"]  # feature sections import where they're defined
"telechat_pkg/claude_core.py" = ["E402"]
