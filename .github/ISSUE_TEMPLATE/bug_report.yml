name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please redact tokens before pasting anything. `telechat env` masks them;
        raw log files do not always.

        **Found a security issue?** Do not file it here — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I sent "/plan refactor the parser" on Telegram.
        Expected a plan; got "Something went wrong" and nothing in the log.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest sequence that shows it. "Every message" is a fine answer.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `telechat --version`.
      placeholder: "telechat 1.2.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Which adapter
      multiple: true
      options:
        - Telegram
        - WhatsApp
        - Slack
        - Web chat
        - Claude Desktop bridge
        - CLI / setup (not a chat adapter)
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Claude mode
      options:
        - cli (Claude Code CLI)
        - api (Anthropic API)
        - not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and Python
      placeholder: "macOS 15.2, Python 3.12.9 (or: Docker image)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        `telechat logs`, or run with `telechat --debug` and paste the traceback.
        This is automatically formatted as code — no backticks needed.
      render: shell
