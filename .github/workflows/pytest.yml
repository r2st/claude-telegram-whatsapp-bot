name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  versions:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Three different version numbers shipped in one release before this check
      # existed (pyproject 1.2.0, __init__ 1.1.5, npm 1.1.1), which left the
      # updater nagging npm users permanently. See item 4 of docs/improvements.md.
      - name: Check every version derives from pyproject.toml
        run: bash scripts/sync-version.sh --check

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile COPYed loose modules from the repository root long after
      # they moved into telechat_pkg/ — including a bot.py that never existed — so
      # `docker compose up` failed at build time on a path the README documents as
      # supported. Nothing caught it because nothing built the image. See item 1.
      - name: Build the image
        run: docker build -t telechat:ci .

      - name: Check the entry point runs in the image
        run: docker run --rm telechat:ci telechat --version

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions pyproject.toml advertises via requires-python. 3.9 was
        # in this matrix briefly and is what proved the floor was wrong: the
        # suite fails and then hangs there, and doctor.py's own check requires
        # 3.10+. requires-python now says 3.10, so the matrix and the floor agree.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev + optional extras
        # The suite imports the optional feature modules (PyMuPDF, playwright,
        # httpx, jsonschema, …), so `all` is required — with only the core
        # dependencies a large part of it silently skips.
        run: pip install -e ".[dev,all]"

      - name: Run pytest
        run: pytest -q

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev + optional extras
        run: pip install -e ".[dev,all]"

      - name: Run pytest with coverage
        # The floor sits just below the current figure (87% since the bridge
        # harness landed, up from 84%) so ordinary churn doesn't fail the build,
        # but it does stop coverage sliding: AGENTS.md used to claim ~99% while
        # the real number was 84%, which is exactly the kind of drift an
        # unenforced number invites.
        run: pytest -q --cov=telechat_pkg --cov-report=term-missing --cov-fail-under=85
