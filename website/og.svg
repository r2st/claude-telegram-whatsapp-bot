<!--
  Social card for telechat.fyi. Rendered to og.png with:
      magick -background none og.svg og.png

  Deliberately plain SVG: solid fills only, no gradients on text and no
  filters. ImageMagick's built-in renderer silently drops both, which is how
  the first version of this card shipped with an invisible second headline
  line. If you edit this file, re-render and *look at the PNG*.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#0b0c0e"/>
  <rect x="0" y="0" width="10" height="630" fill="#ff7a45"/>

  <!-- brand -->
  <rect x="72" y="60" width="46" height="46" rx="12" fill="#eef1f5"/>
  <text x="95" y="91" font-size="20" font-weight="bold" fill="#0b0c0e" text-anchor="middle">TC</text>
  <text x="134" y="92" font-size="30" font-weight="bold" fill="#eef1f5">Telechat</text>

  <!-- headline -->
  <text x="72" y="222" font-size="62" font-weight="bold" fill="#eef1f5">Claude Code&#8217;s mobile companion.</text>
  <text x="72" y="296" font-size="62" font-weight="bold" fill="#ff7a45">Your sessions, in your pocket.</text>

  <text x="72" y="362" font-size="27" fill="#b8c0cc">Desktop sessions page you. You reply. The run carries on.</text>
  <text x="72" y="404" font-size="27" fill="#b8c0cc">Telegram · WhatsApp · Slack · web. Self-hosted. MIT.</text>

  <!-- install command -->
  <rect x="72" y="456" width="742" height="78" rx="16" fill="#14171c" stroke="#252a33" stroke-width="2"/>
  <text x="104" y="504" font-size="26" font-family="Menlo, monospace" fill="#8a93a1">$</text>
  <text x="134" y="504" font-size="26" font-family="Menlo, monospace" fill="#eef1f5">npm install -g telechat &amp;&amp; telechat init</text>

  <text x="1128" y="504" font-size="24" font-family="Menlo, monospace" fill="#8a93a1" text-anchor="end">telechat.fyi</text>
</svg>
