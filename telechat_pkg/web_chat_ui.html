<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeleChat — Chat with Claude from your browser</title>
<meta name="description" content="TeleChat is a self-hosted chat UI for Claude — the same engine that powers your Telegram, WhatsApp, and Slack bot, right in your browser.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#d9534f">

<!-- Open Graph / social sharing -->
<meta property="og:type" content="website">
<meta property="og:title" content="TeleChat — Chat with Claude from your browser">
<meta property="og:description" content="A self-hosted chat UI for Claude — the same engine that powers your Telegram, WhatsApp, and Slack bot.">
<meta property="og:site_name" content="TeleChat">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="TeleChat — Chat with Claude from your browser">
<meta name="twitter:description" content="A self-hosted chat UI for Claude — the same engine that powers your Telegram, WhatsApp, and Slack bot.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d9534f'/%3E%3Ctext x='16' y='23' font-family='-apple-system,Helvetica,Arial,sans-serif' font-size='19' font-weight='700' fill='%23fff' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #ffffff;
  --surface: #f8f9fa;
  --surface2: #f0f1f3;
  --accent: #d9534f;
  --accent-hover: #c9302c;
  --accent-light: #fdf2f2;
  --text: #1a1a1a;
  --text-secondary: #555;
  --text-dim: #999;
  --user-bubble: #e8f0fe;
  --bot-bubble: #f8f9fa;
  --input-bg: #fff;
  --border: #e5e7eb;
  --border-light: #f0f0f0;
  --code-bg: #f6f8fa;
  --code-border: #e1e4e8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --radius: 16px;
  --radius-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a;
    --surface: #1f2023;
    --surface2: #26272b;
    --accent: #e8635e;
    --accent-hover: #f17974;
    --accent-light: #2a1c1c;
    --text: #f0f0f0;
    --text-secondary: #b8b8b8;
    --text-dim: #7a7a7a;
    --user-bubble: #1e2a3d;
    --bot-bubble: #212226;
    --input-bg: #1f2023;
    --border: #33343a;
    --border-light: #2a2b30;
    --code-bg: #1c1d20;
    --code-border: #33343a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  }
  .auth-box { background: var(--surface); }
  .msg .bubble code:not(pre code) { color: #ff8fae; }
  .msg .bubble a { color: #6ea8fe; }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-logo {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 14px;
}
.header h1 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: var(--text);
}
.header .status {
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
}
.header .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #ccc;
  transition: background 0.3s;
}
.header .dot.connected { background: #34c759; }

/* auth overlay */
.auth-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.auth-box {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 32px;
  max-width: 380px;
  width: 90%;
  text-align: center;
  box-shadow: var(--shadow-md);
}
.auth-box h2 { margin-bottom: 6px; font-size: 20px; font-weight: 600; }
.auth-box p { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
.auth-box input {
  width: 100%;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 15px;
  outline: none;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.auth-box input:focus { border-color: var(--accent); }
.auth-box button {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.auth-box button:hover { background: var(--accent-hover); }
.auth-box .error { color: var(--accent); font-size: 13px; margin-top: 10px; }
.hidden { display: none !important; }

/* messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 0;
  scroll-behavior: smooth;
}
.msg-wrap {
  max-width: 768px;
  margin: 0 auto;
  padding: 0 24px;
}
.msg {
  margin-bottom: 24px;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg .role-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.msg .avatar {
  width: 24px; height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
}
.msg.user .avatar { background: #3b82f6; color: #fff; }
.msg.bot .avatar { background: var(--accent); color: #fff; }
.msg.system .avatar { background: #e5e7eb; color: #666; font-style: italic; font-size: 11px; }

.msg .role {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.msg .bubble {
  border-radius: var(--radius);
  padding: 14px 18px;
  line-height: 1.65;
  font-size: 15px;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.msg.user .bubble {
  background: var(--user-bubble);
  border: 1px solid #d4e2f7;
  margin-left: 32px;
}
.msg.bot .bubble {
  background: var(--bot-bubble);
  border: 1px solid var(--border);
  margin-left: 32px;
}
.msg.system .bubble {
  background: #fffbeb;
  border: 1px solid #fde68a;
  margin-left: 32px;
  font-size: 14px;
  color: #92400e;
}

.msg .bubble p { margin-bottom: 10px; }
.msg .bubble p:last-child { margin-bottom: 0; }
.msg .bubble pre {
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  margin: 10px 0;
  font-size: 13px;
  line-height: 1.55;
}
.msg .bubble code {
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', monospace;
  font-size: 13px;
}
.msg .bubble code:not(pre code) {
  background: var(--code-bg);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--code-border);
  color: #c7254e;
}
.msg .bubble ul, .msg .bubble ol {
  padding-left: 22px;
  margin: 8px 0;
}
.msg .bubble li { margin-bottom: 4px; }
.msg .bubble blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 14px;
  color: var(--text-secondary);
  margin: 10px 0;
}
.msg .bubble a { color: #2563eb; text-decoration: none; }
.msg .bubble a:hover { text-decoration: underline; }
.msg .bubble strong { font-weight: 600; }
.msg .bubble em { font-style: italic; }
.msg .bubble h1, .msg .bubble h2, .msg .bubble h3 {
  margin: 14px 0 6px;
  font-weight: 600;
  color: var(--text);
}
.msg .bubble h1 { font-size: 20px; }
.msg .bubble h2 { font-size: 17px; }
.msg .bubble h3 { font-size: 15px; }

/* progress indicator */
.progress-indicator {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--text-dim);
  padding: 6px 0;
}
.progress-indicator .spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.progress-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.tool-badge {
  font-size: 11px;
  background: var(--surface2);
  padding: 3px 10px;
  border-radius: 12px;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

/* stats */
.msg-stats {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 8px;
  margin-left: 32px;
}

/* input area */
.input-area {
  border-top: 1px solid var(--border);
  background: var(--bg);
  padding: 16px 24px 20px;
  flex-shrink: 0;
}
.input-wrap {
  max-width: 768px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 6px 6px 16px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-wrap:focus-within {
  border-color: #bbb;
  box-shadow: 0 0 0 3px rgba(0,0,0,0.04);
}
.input-wrap textarea {
  flex: 1;
  padding: 8px 0;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  line-height: 1.5;
  resize: none;
  outline: none;
  min-height: 40px;
  max-height: 200px;
}
.input-wrap textarea::placeholder { color: #bbb; }
.send-btn {
  width: 40px; height: 40px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, opacity 0.2s;
}
.send-btn:hover:not(:disabled) { background: var(--accent-hover); }
.send-btn:disabled { opacity: 0.35; cursor: default; }
.send-btn svg { width: 18px; height: 18px; }

/* empty state */
.empty-state {
  text-align: center;
  padding: 80px 20px 40px;
}
.empty-logo {
  width: 56px; height: 56px;
  background: var(--accent);
  border-radius: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 800;
  font-size: 24px;
  margin-bottom: 20px;
}
.empty-state h2 {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}
.empty-state p {
  font-size: 15px;
  line-height: 1.6;
  color: var(--text-dim);
  max-width: 400px;
  margin: 0 auto;
}
.empty-state .suggestions {
  margin-top: 32px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}
.empty-state .suggestion {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
}
.empty-state .suggestion:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-light);
}
.empty-state .commands {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  gap: 8px;
}
.empty-state .cmd {
  padding: 5px 12px;
  border: none;
  background: none;
  border-radius: 6px;
  font-size: 12px;
  font-family: 'SF Mono', monospace;
  color: var(--text-dim);
  cursor: pointer;
  transition: color 0.2s;
}
.empty-state .cmd:hover { color: var(--accent); }

.empty-state .suggestion {
  font-family: inherit;
}
.empty-state .suggestion, .empty-state .cmd {
  appearance: none;
}
.empty-state .suggestion:focus-visible, .empty-state .cmd:focus-visible,
.send-btn:focus-visible, .auth-box input:focus-visible, .auth-box button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .msg { animation: none; }
  .progress-indicator .spinner { animation-duration: 1.4s; }
  .messages { scroll-behavior: auto; }
  * { transition-duration: 0.01ms !important; }
}

/* sessions dashboard */
.header-actions { display: flex; align-items: center; gap: 12px; }
.sessions-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 12px;
  font-family: inherit;
  font-weight: 500;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.sessions-btn:hover { color: var(--accent); border-color: var(--accent); }
.sessions-btn[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
.sessions-btn .live-count {
  background: var(--accent);
  color: #fff;
  border-radius: 999px;
  padding: 0 6px;
  font-size: 11px;
  font-weight: 600;
  min-width: 16px;
  text-align: center;
}
.sessions-btn .live-count.zero { background: var(--text-dim); }

.sessions-panel {
  position: absolute;
  top: 56px;
  right: 24px;
  z-index: 40;
  width: 380px;
  max-width: calc(100vw - 32px);
  max-height: min(70vh, 560px);
  overflow-y: auto;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 14px 16px 16px;
}
.sessions-panel.hidden { display: none; }
.sessions-panel h2 {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}
.sessions-panel .panel-sub {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 12px;
}
.sessions-panel .group-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  margin: 14px 0 6px;
}
.sessions-panel .group-label:first-of-type { margin-top: 4px; }
.session-row {
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  margin-bottom: 6px;
  background: var(--surface);
}
.session-row.is-current { border-color: var(--accent); background: var(--accent-light); }
.session-row .row-top {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.session-row .proj {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.session-row .sid {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--text-dim);
}
.session-row .tag {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--surface2);
  color: var(--text-secondary);
}
.session-row .tag.busy { background: #fff3cd; color: #8a6d3b; }
.session-row .tag.idle { background: var(--surface2); color: var(--text-dim); }
.session-row .tag.current { background: var(--accent); color: #fff; }
.session-row .meta {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 3px;
}
.session-row .last {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
  font-style: italic;
  overflow-wrap: anywhere;
}
.sessions-empty {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.5;
  padding: 6px 0;
}
@media (prefers-color-scheme: dark) {
  .session-row .tag.busy { background: #3d3315; color: #f0d48a; }
}

/* visually hidden but available to screen readers */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* scrollbar */
.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
.messages::-webkit-scrollbar-thumb:hover { background: #ccc; }

/* responsive */
@media (max-width: 600px) {
  .header { padding: 12px 16px; }
  .msg-wrap { padding: 0 16px; }
  .input-area { padding: 12px 16px 16px; }
  .msg .avatar { width: 22px; height: 22px; font-size: 11px; }
  .msg .bubble { padding: 12px 14px; margin-left: 30px; }
  .msg-stats { margin-left: 30px; }
  .empty-state { padding: 50px 16px 30px; }
}
</style>
</head>
<body>

<!-- Auth overlay -->
<div class="auth-overlay hidden" id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="auth-box">
    <h2 id="authTitle">TeleChat Web</h2>
    <p id="authHint">Enter your access token to continue.</p>
    <label class="sr-only" for="authToken">Access token</label>
    <input type="password" id="authToken" placeholder="Access token" autocomplete="off" aria-describedby="authHint" aria-invalid="false">
    <button onclick="authenticate()">Connect</button>
    <div class="error hidden" id="authError" role="alert">Invalid token. Try again.</div>
  </div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="header-logo" aria-hidden="true">T</div>
    <h1>TeleChat</h1>
  </div>
  <div class="header-actions">
    <button type="button" class="sessions-btn" id="sessionsBtn" onclick="toggleSessions()"
            aria-expanded="false" aria-controls="sessionsPanel" title="Claude Code sessions on this machine">
      <span aria-hidden="true">🖥</span>
      <span>Sessions</span>
      <span class="live-count zero" id="sessionsCount" aria-hidden="true">0</span>
    </button>
    <div class="status">
      <div class="dot" id="statusDot" aria-hidden="true"></div>
      <span id="statusText" role="status" aria-live="polite">Connecting…</span>
    </div>
  </div>
</div>

<!-- Sessions dashboard -->
<div class="sessions-panel hidden" id="sessionsPanel" role="region" aria-label="Claude Code sessions">
  <h2>Claude Code sessions</h2>
  <div class="panel-sub" id="sessionsSub">Loading…</div>
  <div id="sessionsBody"></div>
</div>

<!-- Messages -->
<div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation">
  <div class="msg-wrap" id="msgWrap">
    <div class="empty-state" id="emptyState">
      <div class="empty-logo" aria-hidden="true">T</div>
      <h2>TeleChat Web</h2>
      <p>Chat with Claude right from your browser. Same engine as Telegram, WhatsApp, and Slack.</p>
      <div class="suggestions">
        <button type="button" class="suggestion" onclick="insertAndSend('Explain how async/await works')">Explain async/await</button>
        <button type="button" class="suggestion" onclick="insertAndSend('Write a Python function to reverse a linked list')">Reverse a linked list</button>
        <button type="button" class="suggestion" onclick="insertAndSend('What are the best practices for REST API design?')">REST API best practices</button>
      </div>
      <div class="commands">
        <button type="button" class="cmd" onclick="insertCmd('/help')">/help</button>
        <button type="button" class="cmd" onclick="insertCmd('/clear')">/clear</button>
        <button type="button" class="cmd" onclick="insertCmd('/new')">/new</button>
        <button type="button" class="cmd" onclick="insertCmd('/sessions')">/sessions</button>
        <button type="button" class="cmd" onclick="insertCmd('/export')">/export</button>
      </div>
    </div>
  </div>
</div>

<!-- Input -->
<div class="input-area">
  <div class="input-wrap">
    <label class="sr-only" for="input">Message Claude</label>
    <textarea id="input" placeholder="Message Claude…" rows="1" disabled></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.405Z"/></svg>
    </button>
  </div>
</div>

<script>
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
let ws = null;
let authenticated = false;
let reconnectDelay = 1000;
let currentStreamId = null;
let streamBuffer = {};

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { reconnectDelay = 1000; };
  ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
  ws.onclose = () => {
    authenticated = false;
    setStatus(false);
    disableInput();
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
  };
  ws.onerror = () => {};
}

function handleMessage(data) {
  switch (data.type) {
    case 'connected':
      if (data.auth_required) {
        document.getElementById('authOverlay').classList.remove('hidden');
        document.getElementById('authToken').focus();
      } else { onAuthenticated(); }
      break;
    case 'auth_ok':
      document.getElementById('authOverlay').classList.add('hidden');
      document.getElementById('authError').classList.add('hidden');
      onAuthenticated();
      break;
    case 'auth_fail':
      document.getElementById('authError').classList.remove('hidden');
      break;
    case 'thinking':
      hideEmpty();
      currentStreamId = data.msg_id;
      streamBuffer[data.msg_id] = '';
      addThinking(data.msg_id);
      break;
    case 'progress':
      updateProgress(data.msg_id, data.tool, data.detail);
      break;
    case 'stream':
      appendStream(data.msg_id, data.text);
      break;
    case 'reply':
      hideThinking(data.msg_id);
      addBotMessage(data.text, data.stats);
      currentStreamId = null;
      enableInput();
      break;
    case 'done':
      finalizeStream(data.msg_id, data.stats);
      currentStreamId = null;
      enableInput();
      break;
    case 'system':
      hideEmpty();
      addSystemMessage(data.text);
      enableInput();
      break;
    case 'download':
      triggerDownload(data.filename, data.content, data.mime);
      addSystemMessage(`Exported ${data.message_count} message(s) as ${data.filename}`);
      enableInput();
      break;
    case 'sessions':
      renderSessions(data);
      break;
    case 'error':
      hideThinking(data.msg_id);
      addSystemMessage('Error: ' + data.text);
      currentStreamId = null;
      enableInput();
      break;
  }
}

/* ── sessions dashboard ───────────────────────────────────────────────── */

let sessionsOpen = false;
let sessionsTimer = null;
const SESSIONS_POLL_MS = 5000;

function requestSessions() {
  if (ws && ws.readyState === WebSocket.OPEN && authenticated) {
    ws.send(JSON.stringify({ type: 'sessions' }));
  }
}

function toggleSessions() {
  sessionsOpen = !sessionsOpen;
  const panel = document.getElementById('sessionsPanel');
  const btn = document.getElementById('sessionsBtn');
  panel.classList.toggle('hidden', !sessionsOpen);
  btn.setAttribute('aria-expanded', String(sessionsOpen));
  if (sessionsOpen) {
    requestSessions();
    // Poll only while visible — a closed panel should cost nothing.
    sessionsTimer = setInterval(requestSessions, SESSIONS_POLL_MS);
  } else if (sessionsTimer) {
    clearInterval(sessionsTimer);
    sessionsTimer = null;
  }
}

function renderSessions(data) {
  const running = data.running || [];
  const recent = data.recent || [];
  const live = running.length;

  const countEl = document.getElementById('sessionsCount');
  countEl.textContent = String(live);
  countEl.classList.toggle('zero', live === 0);

  const sub = document.getElementById('sessionsSub');
  const body = document.getElementById('sessionsBody');
  body.innerHTML = '';

  if (!data.available) {
    sub.textContent = 'Desktop bridge unavailable';
    const p = document.createElement('div');
    p.className = 'sessions-empty';
    p.textContent = data.reason || 'No sessions found.';
    body.appendChild(p);
    return;
  }

  const busy = running.filter(s => s.busy).length;
  sub.textContent = live === 0
    ? 'Nothing running right now'
    : `${live} running · ${busy} working · ${running.length - busy} idle`;

  if (live > 0) {
    body.appendChild(groupLabel('Running now'));
    running.forEach(s => body.appendChild(sessionRow(s, true)));
  }
  if (recent.length > 0) {
    body.appendChild(groupLabel('Recent'));
    recent.forEach(s => body.appendChild(sessionRow(s, false)));
  }
  if (live === 0 && recent.length === 0) {
    const p = document.createElement('div');
    p.className = 'sessions-empty';
    p.textContent = 'No Claude Code sessions yet. Start one and it will show up here.';
    body.appendChild(p);
  }
}

function groupLabel(text) {
  const el = document.createElement('div');
  el.className = 'group-label';
  el.textContent = text;
  return el;
}

function sessionRow(s, isRunning) {
  const el = document.createElement('div');
  el.className = 'session-row' + (s.current ? ' is-current' : '');

  const top = document.createElement('div');
  top.className = 'row-top';
  top.appendChild(span('proj', s.project || '(new session)'));
  if (s.short) top.appendChild(span('sid', s.short));
  if (isRunning) {
    top.appendChild(span('tag ' + (s.busy ? 'busy' : 'idle'), s.busy ? 'working' : 'idle'));
    if (s.approve) top.appendChild(span('tag', '🔐 approvals'));
  } else if (s.running) {
    top.appendChild(span('tag busy', 'running'));
  }
  if (s.current) top.appendChild(span('tag current', 'current'));
  el.appendChild(top);

  const bits = [];
  if (isRunning) {
    if (s.model) bits.push(s.model);
    if (s.uptime) bits.push('up ' + s.uptime);
  } else if (s.ago) {
    bits.push(s.ago);
  }
  if (s.cwd) bits.push(s.cwd);
  if (bits.length) el.appendChild(div('meta', bits.join(' · ')));

  if (s.last) el.appendChild(div('last', s.last));
  return el;
}

function span(cls, text) {
  const el = document.createElement('span');
  el.className = cls;
  el.textContent = text;
  return el;
}

function div(cls, text) {
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = text;
  return el;
}

function triggerDownload(filename, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename || 'chat_export.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function onAuthenticated() {
  authenticated = true;
  setStatus(true);
  enableInput();
  // Populate the header badge immediately, so the count is right before the
  // panel is ever opened — and refresh it after a reconnect.
  requestSessions();
}

function setStatus(connected) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.classList.toggle('connected', connected);
  text.textContent = connected ? 'Connected' : 'Reconnecting…';
}

function enableInput() {
  const input = document.getElementById('input');
  document.getElementById('sendBtn').disabled = false;
  input.disabled = false;
  input.focus();
}
function disableInput() {
  document.getElementById('input').disabled = true;
  document.getElementById('sendBtn').disabled = true;
}

function hideEmpty() {
  const el = document.getElementById('emptyState');
  if (el) el.remove();
}

function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  hideEmpty();
  if (!text.startsWith('/')) addUserMessage(text);
  ws.send(JSON.stringify({ type: 'message', text }));
  input.value = '';
  input.style.height = 'auto';
  if (!text.startsWith('/')) disableInput();
}

function insertAndSend(text) {
  const input = document.getElementById('input');
  input.value = text;
  sendMessage();
}

function authenticate() {
  const token = document.getElementById('authToken').value;
  if (ws && ws.readyState === 1)
    ws.send(JSON.stringify({ type: 'auth', token }));
}

function addUserMessage(text) {
  const wrap = document.getElementById('msgWrap');
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `
    <div class="role-row"><div class="avatar">Y</div><div class="role">You</div></div>
    <div class="bubble">${escapeHtml(text)}</div>`;
  wrap.appendChild(el);
  scrollBottom();
}

function addBotMessage(text, stats) {
  const wrap = document.getElementById('msgWrap');
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = `
    <div class="role-row"><div class="avatar">C</div><div class="role">Claude</div></div>
    <div class="bubble">${renderMarkdown(text)}</div>
    ${statsHtml(stats)}`;
  wrap.appendChild(el);
  scrollBottom();
}

function addSystemMessage(text) {
  const wrap = document.getElementById('msgWrap');
  const el = document.createElement('div');
  el.className = 'msg system';
  el.innerHTML = `
    <div class="role-row"><div class="avatar">i</div><div class="role">System</div></div>
    <div class="bubble">${renderMarkdown(text)}</div>`;
  wrap.appendChild(el);
  scrollBottom();
}

function addThinking(msgId) {
  const wrap = document.getElementById('msgWrap');
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.id = 'thinking-' + msgId;
  el.innerHTML = `
    <div class="role-row"><div class="avatar">C</div><div class="role">Claude</div></div>
    <div class="bubble">
      <div class="progress-indicator">
        <div class="spinner"></div>
        <span>Thinking…</span>
      </div>
      <div class="progress-tools" id="tools-${msgId}"></div>
      <div class="bubble-stream" id="stream-${msgId}" style="display:none"></div>
    </div>`;
  wrap.appendChild(el);
  scrollBottom();
}

function updateProgress(msgId, tool, detail) {
  const toolsEl = document.getElementById('tools-' + msgId);
  if (!toolsEl) return;
  const badge = document.createElement('span');
  badge.className = 'tool-badge';
  badge.textContent = tool + (detail ? ': ' + detail : '');
  toolsEl.appendChild(badge);
  const indicator = document.querySelector('#thinking-' + msgId + ' .progress-indicator span');
  if (indicator) indicator.textContent = 'Working…';
  scrollBottom();
}

function appendStream(msgId, text) {
  streamBuffer[msgId] = (streamBuffer[msgId] || '') + text;
  const streamEl = document.getElementById('stream-' + msgId);
  if (!streamEl) return;
  streamEl.style.display = 'block';
  streamEl.innerHTML = renderMarkdown(streamBuffer[msgId]);
  const indicator = document.querySelector('#thinking-' + msgId + ' .progress-indicator');
  if (indicator) indicator.style.display = 'none';
  scrollBottom();
}

function finalizeStream(msgId, stats) {
  const thinkEl = document.getElementById('thinking-' + msgId);
  if (!thinkEl) return;
  const indicator = thinkEl.querySelector('.progress-indicator');
  if (indicator) indicator.remove();
  const toolsEl = document.getElementById('tools-' + msgId);
  if (toolsEl) toolsEl.remove();
  const streamEl = document.getElementById('stream-' + msgId);
  if (streamEl && streamBuffer[msgId])
    streamEl.innerHTML = renderMarkdown(streamBuffer[msgId]);
  if (stats) {
    const s = document.createElement('div');
    s.className = 'msg-stats';
    s.innerHTML = statsContent(stats);
    thinkEl.appendChild(s);
  }
  delete streamBuffer[msgId];
  scrollBottom();
}

function hideThinking(msgId) {
  const el = document.getElementById('thinking-' + msgId);
  if (el) el.remove();
}

function statsHtml(stats) {
  if (!stats) return '';
  return '<div class="msg-stats">' + statsContent(stats) + '</div>';
}
function statsContent(stats) {
  const parts = [];
  if (stats.input_tokens) parts.push(stats.input_tokens.toLocaleString() + ' in');
  if (stats.output_tokens) parts.push(stats.output_tokens.toLocaleString() + ' out');
  if (stats.cost_usd) parts.push('$' + stats.cost_usd.toFixed(4));
  if (stats.tools_used && stats.tools_used.length) parts.push(stats.tools_used.length + ' tools');
  return parts.join(' &middot; ');
}

function scrollBottom() {
  const m = document.getElementById('messages');
  requestAnimationFrame(() => { m.scrollTop = m.scrollHeight; });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Restrict markdown link hrefs to safe schemes. Model output can contain
// [text](javascript:...) — without this check, the rendered anchor would
// execute arbitrary JS in the browser when clicked. Also reject data:,
// vbscript:, file:, and other non-navigation schemes.
function safeUrl(raw) {
  // The URL has already been HTML-escaped (renderMarkdown escapes the full
  // text first). Decode common entities back so we can pattern-match the
  // scheme reliably; the value is re-escaped on its way into the href.
  const decoded = String(raw)
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'");
  const trimmed = decoded.trim();
  // Permit relative paths, fragments, and protocol-relative URLs as-is.
  if (/^(?:[#/?]|\.\.?\/)/.test(trimmed)) return escapeHtml(trimmed);
  // Permit explicit schemes only from a tight allow-list. Use a
  // case-insensitive match because "JavaScript:" works in browsers too.
  const schemeMatch = trimmed.match(/^([a-z][a-z0-9+.\-]*):/i);
  if (schemeMatch) {
    const scheme = schemeMatch[1].toLowerCase();
    if (scheme !== 'http' && scheme !== 'https' && scheme !== 'mailto') {
      return '#';
    }
  }
  return escapeHtml(trimmed);
}

function renderMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
    '<pre><code>' + code.trim() + '</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
    (_, label, url) => '<a href="' + safeUrl(url) + '" target="_blank" rel="noopener">' + label + '</a>');
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^[*-] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  html = html.replace(/\n{2,}/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<p>(<h[123]>)/g, '$1');
  html = html.replace(/(<\/h[123]>)<\/p>/g, '$1');
  html = html.replace(/<p>(<pre>)/g, '$1');
  html = html.replace(/(<\/pre>)<\/p>/g, '$1');
  html = html.replace(/<p>(<ul>)/g, '$1');
  html = html.replace(/(<\/ul>)<\/p>/g, '$1');
  html = html.replace(/<p>(<blockquote>)/g, '$1');
  html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
  return html;
}

function insertCmd(cmd) {
  const input = document.getElementById('input');
  input.value = cmd;
  input.focus();
}

const input = document.getElementById('input');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('authToken').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') authenticate();
});

connect();
</script>
</body>
</html>
